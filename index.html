*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,textarea,input{font:inherit}.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 18px;border-right:1px solid var(--line);background:#fff9f3}.brand{font-size:21px;font-weight:900}.brand small{display:block;margin-top:4px;font-size:11px;color:var(--muted);font-weight:700}.nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:20px 0}.nav button{border:1px solid var(--line);background:#fffdf9;padding:9px 8px;border-radius:11px;color:var(--muted);cursor:pointer;font-weight:800;font-size:12px}.nav button.active{background:#ead8ca;color:#7c452f;border-color:#caa48d}.progressbox{padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--panel);margin-bottom:16px}.progressrow{display:flex;justify-content:space-between;gap:10px;font-size:12px}.bar{height:8px;background:#eadfd5;border-radius:99px;overflow:hidden;margin:9px 0}.bar i{height:100%;display:block;background:var(--accent);width:5%}.lessonlist{display:grid;gap:6px}.lessonbtn{border:1px solid transparent;background:transparent;border-radius:12px;padding:10px 10px;text-align:left;cursor:pointer;color:var(--muted)}.lessonbtn:hover{background:#f2e6dc}.lessonbtn.active{background:#ead8ca;color:#693d2c;border-color:#d3b29f}.lessonbtn.done:before{content:'✓';float:right;color:var(--green);font-weight:900}.lessonbtn b{display:block;font-size:12px;color:inherit}.lessonbtn span{display:block;margin-top:3px;font-size:10px;line-height:1.35}.main{min-width:0;padding:24px 30px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:900}.status{padding:8px 11px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:11px}.hero{background:linear-gradient(135deg,#fffaf4,#f6e7dc);border:1px solid var(--line);border-radius:24px;padding:26px 28px;margin-bottom:16px}.hero h1{font-size:34px;margin:6px 0 10px;line-height:1.06}.hero p{color:var(--muted);max-width:850px;line-height:1.65;margin:0}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.chip{font-size:10px;padding:6px 9px;border-radius:99px;background:#fff7f1;border:1px solid #ead7ca;font-weight:800;color:#6f4a39}.tabs{display:flex;gap:8px;position:sticky;top:0;z-index:4;padding:10px 0;background:linear-gradient(var(--bg) 75%,transparent)}.tabs button{border:1px solid var(--line);background:var(--panel);padding:9px 13px;border-radius:11px;cursor:pointer;font-weight:800;color:var(--muted)}.tabs button.active{background:var(--accent);color:white;border-color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px}.article,.card{background:var(--panel);border:1px solid var(--line);border-radius:20px}.article{padding:28px}.toc{position:sticky;top:60px;padding:18px;height:max-content}.toc strong{font-size:12px}.toc a{display:block;color:var(--muted);text-decoration:none;font-size:11px;line-height:1.35;padding:6px 0}.toc a:hover{color:var(--accent2)}.chapter{padding:2px 0 22px;margin-bottom:22px;border-bottom:1px solid #eadfd5;line-height:1.72}.chapter:last-child{border-bottom:0}.chapter h2{font-size:25px;margin:0 0 12px}.chapter h3{font-size:17px;margin:20px 0 8px}.chapter p{margin:9px 0}.chapter ul{margin:9px 0 12px;padding-left:22px}.chapter li{margin:6px 0}.lead{font-size:17px;line-height:1.7;color:#4a413b}.callout{border-left:4px solid var(--accent);padding:13px 15px;background:#f7e9de;border-radius:0 12px 12px 0;margin:16px 0}.callout.green{border-color:var(--green);background:#e8efe9}.callout.red{border-color:var(--red);background:#f4e5e1}.callout.amber{border-color:var(--amber);background:#f4ecdf}.callout b{display:block;margin-bottom:5px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.mini{padding:13px;border:1px solid var(--line);border-radius:13px;background:#fffdf9}.mini b{display:block;margin-bottom:5px}.code{background:var(--code);color:#f7efe8;border-radius:14px;padding:15px 17px;overflow:auto;font:13px/1.65 Consolas,Monaco,monospace;margin:13px 0;white-space:pre}.inline{font-family:Consolas,monospace;background:#eee2d7;padding:2px 5px;border-radius:6px}.qa{display:grid;gap:9px}.qa details{border:1px solid var(--line);background:#fffdf9;border-radius:13px;padding:12px 14px}.qa summary{font-weight:850;cursor:pointer}.qa p{color:var(--muted)}.practicegrid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px}.exercise-list{display:grid;gap:7px;align-content:start}.exercise{border:1px solid var(--line);border-radius:12px;background:#fffdf9;padding:11px;text-align:left;cursor:pointer}.exercise.active{background:#ead8ca;border-color:#caa48d}.exercise.done{border-left:4px solid var(--green)}.workbench{padding:20px}.task{line-height:1.6;color:var(--muted)}textarea.sql{width:100%;min-height:260px;background:#292622;color:#fff;border:1px solid #443b35;border-radius:14px;padding:15px;font:14px/1.6 Consolas,monospace;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:11px 0}.btn{border:0;background:var(--accent);color:#fff;padding:10px 14px;border-radius:11px;cursor:pointer;font-weight:850}.btn.alt{background:#efe3d8;color:var(--ink);border:1px solid var(--line)}.feedback{padding:12px;border-radius:12px;margin-top:10px}.ok{background:#e6efe8;color:#36563f}.bad{background:#f3e3df;color:#783d36}.result{overflow:auto;max-height:330px;border:1px solid var(--line);border-radius:12px;margin-top:12px;background:#fff}.result table{border-collapse:collapse;width:100%;font-size:12px}.result th,.result td{padding:8px 9px;border-bottom:1px solid #eee1d7;text-align:left}.interview-card{padding:22px}.interview-q{font-size:21px;line-height:1.45;margin:8px 0 18px}.answerbox{padding:16px;border-radius:14px;background:#fffdf9;border:1px solid var(--line);line-height:1.65}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px}.kpi strong{display:block;font-size:25px;margin-top:6px}.hidden{display:none!important}.placeholder{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:1fr}.toc{position:relative;top:auto}.practicegrid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{height:auto;position:relative}.main{padding:18px}.lessonlist{max-height:340px;overflow:auto}.hero h1{font-size:28px}.compare{grid-template-columns:1fr}}

<script type="module">
import { PGlite } from 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite/dist/index.js';

const roadmap=[
'БД, SQL и реляционная модель','Типы данных, constraints и CREATE TABLE','CRUD: INSERT, UPDATE, DELETE','SELECT глубже: aliases, DISTINCT, expressions','WHERE: AND/OR/NOT, IN, BETWEEN','Строки: LIKE, ILIKE, функции','NULL и трёхзначная логика','ORDER BY, LIMIT, OFFSET, keyset pagination','Агрегаты COUNT/SUM/AVG/MIN/MAX','GROUP BY','HAVING и порядок выполнения SQL','Модель данных и кардинальности','INNER JOIN','LEFT/RIGHT/FULL JOIN','Несколько JOIN и размножение строк','N:M и таблицы-связки','CASE и условная логика','Подзапросы, IN, EXISTS, NOT EXISTS','CTE и WITH','Set operations: UNION/INTERSECT/EXCEPT','Оконные функции','ROW_NUMBER, RANK, DENSE_RANK','LAG, LEAD, running totals','Нормализация 1NF–3NF','ERD, сущности, атрибуты и связи','Natural vs surrogate keys, UUID, external_id','FK actions: CASCADE/RESTRICT/SET NULL','Индексы: B-tree и селективность','Составные, partial и expression indexes','EXPLAIN / EXPLAIN ANALYZE','Транзакции и ACID','Isolation levels и anomalies','MVCC и блокировки','SELECT FOR UPDATE, race conditions, deadlocks','Views и materialized views','JSONB в PostgreSQL','Миграции, backfill и zero-downtime изменения','Soft delete, дедупликация и идемпотентность','Performance anti-patterns и SQL review','Middle+ interview + финальный CRM capstone'];

const lessons={
1:{level:'Base → уверенный фундамент',time:'35–50 мин теория + практика',goal:'После урока ты должен не заучить SELECT, а уметь объяснить разработчику, как устроена реляционная модель и почему данные связаны именно так.',sections:[
['Не начинаем с синтаксиса — начинаем с модели мира',`<p class="lead">SQL становится простым, когда ты понимаешь, <b>что именно лежит в базе</b>. База данных — это не Excel на сервере. Это формальная модель предметной области: какие сущности существуют, какими атрибутами обладают и как связаны между собой.</p><p>Представь amoCRM. В бизнесе мы говорим «есть клиент, у него есть сделки, за сделку отвечает менеджер». В реляционной модели это превращается в таблицы <span class="inline">contacts</span>, <span class="inline">deals</span>, <span class="inline">users</span> и связи между ними.</p><div class="code">users\n  id PK\n  name\n\ncontacts\n  id PK\n  name\n  phone\n\ndeals\n  id PK\n  name\n  contact_id FK -> contacts.id\n  responsible_user_id FK -> users.id</div><div class="callout green"><b>Мышление аналитика</b>Когда видишь поле <span class="inline">responsible_user_id</span>, задавай вопрос не «какой у него тип?», а «на какую сущность оно ссылается, обязательна ли связь и что произойдёт при удалении пользователя?»</div>`],
['База данных, СУБД и SQL — три разные вещи',`<div class="compare"><div class="mini"><b>База данных</b>Конкретные данные и структура: таблицы, строки, связи, ограничения.</div><div class="mini"><b>СУБД</b>Программа, управляющая базой. В нашем курсе — PostgreSQL.</div></div><p><b>SQL</b> — язык, на котором мы формулируем СУБД команды: прочитать данные, изменить их, создать таблицу, ограничить значения, начать транзакцию и т.д.</p><div class="code">SELECT name, price\nFROM deals\nWHERE status = 'won';</div><p>Запрос не «лезет в файл». PostgreSQL получает текст SQL, строит план выполнения, обращается к нужным страницам/индексам и возвращает набор строк. Позже мы отдельно разберём <span class="inline">EXPLAIN</span>.</p>`],
['Таблица, строка, столбец, значение',`<p>Для аналитика полезна терминология через сущности:</p><ul><li><b>Таблица</b> — набор однотипных сущностей, например сделки.</li><li><b>Строка</b> — один экземпляр сущности: сделка #150.</li><li><b>Столбец</b> — атрибут сущности: цена, статус, дата создания.</li><li><b>Значение</b> — конкретное значение атрибута в конкретной строке.</li></ul><div class="callout amber"><b>Не путай структуру и данные</b><span class="inline">price NUMERIC(12,2)</span> — описание структуры. <span class="inline">125000.50</span> — данные.</div>`],
['PRIMARY KEY: идентичность строки',`<p><span class="inline">PRIMARY KEY</span> отвечает на вопрос: «Как однозначно сослаться именно на эту строку?» Чаще это числовой <span class="inline">id</span> или UUID, но PK технически может быть и строкой, и составным ключом.</p><p>Важно: PK уникален <b>внутри своей таблицы</b>. <span class="inline">users.id = 15</span> и <span class="inline">deals.id = 15</span> не конфликтуют.</p><div class="callout red"><b>Частая ошибка на собеседовании</b>Говорить «PRIMARY KEY — это обязательно INTEGER». Нет. Требования — уникальность и NOT NULL; конкретный тип зависит от модели.</div>`],
['FOREIGN KEY и ссылочная целостность',`<p>Если <span class="inline">deals.responsible_user_id = 15</span>, то мы ожидаем, что пользователь 15 действительно существует. FOREIGN KEY позволяет СУБД контролировать это правило.</p><div class="code">responsible_user_id BIGINT REFERENCES users(id)</div><p>Без FK приложение может случайно сохранить <span class="inline">responsible_user_id = 999999</span>, которого нет. Такая запись называется «осиротевшей» связью.</p><p>FK — это не просто «поле с ID». Это <b>ограничение целостности</b>. Позже мы разберём <span class="inline">ON DELETE CASCADE</span>, <span class="inline">RESTRICT</span>, <span class="inline">SET NULL</span>.</p>`],
['Почему мы храним ID, а не имя',`<p>Имя пользователя может повторяться и меняться. ID должен оставаться стабильной идентичностью.</p><div class="compare"><div class="mini"><b>Плохо</b><span class="inline">responsible_user = 'Иван Иванов'</span><br>Переименование требует обновить множество строк.</div><div class="mini"><b>Хорошо</b><span class="inline">responsible_user_id = 15</span><br>Имя меняется только в <span class="inline">users</span>.</div></div><p>Это один из первых шагов к нормализации: не дублировать одно и то же бизнес-значение во многих местах.</p>`],
['NULL: не пустота, а неизвестность/отсутствие',`<p><span class="inline">NULL</span> — особое состояние. Это не число 0, не пустая строка и не FALSE.</p><div class="code">NULL  !=  0\nNULL  !=  ''\nNULL  !=  FALSE\nNULL  !=  'NULL'</div><p>Из-за этого SQL использует трёхзначную логику: TRUE / FALSE / UNKNOWN. В уроке 7 мы подробно увидим, почему <span class="inline">email = NULL</span> не работает.</p>`],
['Первый SELECT и как его читать',`<div class="code">SELECT name, price\nFROM deals\nWHERE price > 50000;</div><p>Для человека запрос читается сверху вниз, но логически полезнее мыслить так: <b>FROM</b> — откуда берём строки → <b>WHERE</b> — какие строки оставляем → <b>SELECT</b> — какие столбцы выводим. Это подготовит тебя к <span class="inline">GROUP BY</span>, <span class="inline">HAVING</span> и оконным функциям.</p>`]
],interview:[['Чем PostgreSQL отличается от SQL?','PostgreSQL — конкретная СУБД. SQL — язык работы с реляционными данными.'],['Что гарантирует FOREIGN KEY?','Ссылочную целостность: значение FK должно ссылаться на допустимую строку родительской таблицы, если FK не NULL.'],['Почему хранить имя менеджера в каждой сделке хуже, чем user_id?','Имя не является стабильной идентичностью, может повторяться и меняться; возникает дублирование и риск рассинхронизации.']]},
2:{level:'Base+',time:'45–60 мин',goal:'Уметь выбирать типы данных и constraints не «по привычке», а исходя из смысла данных, диапазона, точности и бизнес-правил.',sections:[
['Тип данных — часть контракта',`<p class="lead">Когда аналитик пишет спецификацию поля, «строка» — слишком мало. Нужно понимать ограничения: максимальную длину, обязательность, диапазон, точность, часовой пояс, уникальность.</p><p>Тип данных определяет, <b>какие значения СУБД умеет хранить и какие операции над ними осмысленны</b>.</p>`],
['INTEGER и BIGINT',`<p><span class="inline">INTEGER</span> — целое число. <span class="inline">BIGINT</span> — тоже целое, но с гораздо большим диапазоном. Для ID в долгоживущих системах часто выбирают BIGINT.</p><div class="callout amber"><b>Но телефон — не число</b>Телефон может содержать <span class="inline">+</span>, ведущие нули, пробелы и форматирование. Мы не складываем телефоны и не делим их, поэтому семантически это строка.</div>`],
['VARCHAR и TEXT',`<p>В PostgreSQL <span class="inline">VARCHAR(n)</span> ограничивает длину, <span class="inline">TEXT</span> практически не ограничивает. По производительности между TEXT и VARCHAR без ограничения обычно нет магической разницы.</p><div class="code">name VARCHAR(150)\nemail VARCHAR(255)\ncomment TEXT</div><p>Если длина важна как бизнес-правило/контракт — фиксируй её. Если ограничение искусственное, TEXT может быть честнее.</p>`],
['NUMERIC для денег и почему не FLOAT',`<p>Деньги обычно требуют точного десятичного представления. <span class="inline">NUMERIC(12,2)</span> означает до 12 цифр всего, из них 2 после десятичной точки.</p><div class="code">price NUMERIC(12,2)</div><p>FLOAT/DOUBLE используют двоичное представление с плавающей точкой и могут давать небольшие ошибки округления. Для аналитики измерений это нормально, для точных денежных расчётов часто нет.</p>`],
['DATE, TIMESTAMP и TIMESTAMPTZ',`<p><span class="inline">DATE</span> хранит календарную дату. <span class="inline">TIMESTAMP</span> — дату и время без информации о часовом поясе. <span class="inline">TIMESTAMPTZ</span> в PostgreSQL представляет конкретный момент времени и отображает его с учётом timezone сессии.</p><div class="callout green"><b>Для интеграций</b>События вроде «сделка создана в этот момент» обычно удобнее моделировать как конкретный момент времени. Дата рождения — просто DATE.</div>`],
['Constraints: база защищает бизнес-правила',`<ul><li><span class="inline">NOT NULL</span> — значение обязательно.</li><li><span class="inline">UNIQUE</span> — повтор значения запрещён.</li><li><span class="inline">CHECK</span> — произвольное логическое условие.</li><li><span class="inline">PRIMARY KEY</span> — уникальная идентичность строки.</li><li><span class="inline">FOREIGN KEY</span> — ссылочная целостность.</li><li><span class="inline">DEFAULT</span> — значение, если при INSERT колонка не задана.</li></ul><div class="code">price NUMERIC(12,2) CHECK (price >= 0),\nstatus VARCHAR(30) NOT NULL,\nis_active BOOLEAN NOT NULL DEFAULT TRUE</div>`],
['CREATE TABLE как описание модели',`<div class="code">CREATE TABLE contacts (\n  id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  name VARCHAR(150) NOT NULL,\n  phone VARCHAR(30) NOT NULL,\n  email VARCHAR(255),\n  birth_date DATE,\n  is_active BOOLEAN NOT NULL DEFAULT TRUE,\n  created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\n);</div><p>Читай каждую строку как контракт: имя атрибута → тип → ограничения → default. Так аналитик быстрее замечает, чего не хватает в требованиях.</p>`]
],interview:[['Почему phone обычно VARCHAR, хотя там цифры?','Потому что это идентификатор/строка, а не количественная величина; возможны +, ведущие нули и форматирование.'],['NUMERIC против FLOAT для цены?','NUMERIC хранит точные десятичные значения; FLOAT может иметь двоичные погрешности.'],['DEFAULT и NOT NULL — одно и то же?','Нет. DEFAULT подставляет значение при отсутствии колонки в INSERT, а NOT NULL запрещает итоговый NULL.']]},
3:{level:'Base+ → рабочий SQL',time:'60–90 мин',goal:'Уверенно изменять данные, понимать риски DML и писать безопасные INSERT/UPDATE/DELETE так, как ожидают от Middle аналитика.',sections:[
['CRUD — не четыре слова, а четыре разных риска',`<p class="lead">На работе системный аналитик редко «просто пишет INSERT». Он описывает сценарий: что создаём, какие поля обязательны, что происходит при повторном запросе, как вернуть ID, что делать при ошибке и как не обновить лишние строки.</p><div class="compare"><div class="mini"><b>Create</b>INSERT — добавляет новую строку.</div><div class="mini"><b>Read</b>SELECT — читает данные.</div><div class="mini"><b>Update</b>UPDATE — изменяет существующие строки.</div><div class="mini"><b>Delete</b>DELETE — удаляет строки.</div></div>`],
['INSERT: всегда думай о колонках явно',`<div class="code">INSERT INTO contacts (name, phone, email)\nVALUES ('Сергей Сидоров', '+79990000003', 'sergey@example.com');</div><p>Явный список колонок делает запрос устойчивее к изменению схемы и легче читается на code review. Без списка колонок ты зависишь от физического порядка столбцов таблицы — это плохая привычка.</p><div class="callout red"><b>Плохой стиль</b><span class="inline">INSERT INTO contacts VALUES (...)</span> может технически работать, но в реальном проекте это хрупко и плохо читается.</div>`],
['Несколько строк одним INSERT',`<div class="code">INSERT INTO products (name, price, quantity)\nVALUES\n  ('Фильтр', 2500, 4),\n  ('Кронштейн', 1800, 7);</div><p>Bulk insert обычно эффективнее множества отдельных запросов, потому что уменьшается количество round trip между приложением и БД.</p>`],
['DEFAULT и GENERATED ID при INSERT',`<p>Если <span class="inline">id</span> генерируется как IDENTITY, его обычно не передают вручную. Если <span class="inline">created_at</span> имеет DEFAULT CURRENT_TIMESTAMP, его тоже можно опустить.</p><div class="code">INSERT INTO contacts (name, phone)\nVALUES ('Анна', '+79990000004');</div><p>База сама создаст ID и дату создания.</p>`],
['RETURNING — то, что постоянно нужно интеграциям',`<div class="code">INSERT INTO contacts (name, phone)\nVALUES ('Анна', '+79990000004')\nRETURNING id, created_at;</div><p>PostgreSQL сразу вернёт созданный ID. Это намного лучше сценария «INSERT, потом отдельный SELECT угадывает последнюю запись».</p><div class="callout green"><b>Типовой flow API</b>Backend делает INSERT ... RETURNING id → получает ID → использует его для создания связанных сущностей или ответа API.</div>`],
['UPDATE: сначала SELECT, потом UPDATE',`<p>Самый опасный класс ошибок начинающих — неправильный <span class="inline">WHERE</span>.</p><div class="code">-- 1. сначала проверяем выборку\nSELECT id, name, status\nFROM deals\nWHERE status = 'new';\n\n-- 2. только убедившись, обновляем\nUPDATE deals\nSET price = price + 10000\nWHERE status = 'new';</div><div class="callout red"><b>UPDATE без WHERE</b>Изменит <u>каждую</u> строку таблицы. В production это может стать инцидентом.</div>`],
['Обновление нескольких колонок',`<div class="code">UPDATE deals\nSET status = 'won',\n    price = 95000\nWHERE id = 5\nRETURNING id, status, price;</div><p>В одном UPDATE можно менять несколько колонок. RETURNING полезен и здесь — можно сразу увидеть фактическое новое состояние.</p>`],
['DELETE: физическое удаление',`<div class="code">DELETE FROM contacts\nWHERE id = 42;</div><p>DELETE удаляет конкретные строки и может использовать WHERE. Но физическое удаление не всегда соответствует бизнес-требованию.</p><h3>DELETE vs TRUNCATE</h3><ul><li>DELETE — DML, умеет WHERE, построчно удаляет подходящие записи.</li><li>TRUNCATE — быстро очищает всю таблицу, WHERE нет; имеет другое поведение с identity/FK и блокировками.</li></ul>`],
['Soft delete — почему «удалить» часто значит не DELETE',`<p>CRM часто должна сохранять историю. Тогда вместо физического удаления добавляют, например, <span class="inline">deleted_at</span> или <span class="inline">is_deleted</span>.</p><div class="code">UPDATE contacts\nSET deleted_at = CURRENT_TIMESTAMP\nWHERE id = 42;</div><p>Но soft delete усложняет запросы: почти везде нужно учитывать признак удаления, индексы и уникальность. Поэтому это архитектурное решение, а не автоматическое правило.</p>`],
['UPSERT и идемпотентность — уже уровень интеграций',`<p>Если внешняя система повторно присылает один и тот же объект, простой INSERT может создать дубль. PostgreSQL поддерживает <span class="inline">ON CONFLICT</span>.</p><div class="code">INSERT INTO users (email, name)\nVALUES ('ivan@example.com', 'Иван')\nON CONFLICT (email)\nDO UPDATE SET name = EXCLUDED.name\nRETURNING id;</div><p>Это называется upsert: insert или update при конфликте уникального ключа. В интеграциях это один из инструментов идемпотентности, но не единственный.</p>`],
['Транзакционное мышление',`<p>Представь: создать заказ → списать остаток → создать платёж. Если второй шаг упал, нельзя оставлять только первую половину.</p><div class="code">BEGIN;\n  INSERT INTO orders ...;\n  UPDATE products SET quantity = quantity - 1 ...;\n  INSERT INTO payments ...;\nCOMMIT;</div><p>Позже мы подробно разберём ACID и isolation levels. Сейчас важно привыкнуть задавать вопрос: <b>какие изменения должны быть атомарными?</b></p>`],
['Безопасный чек-лист перед UPDATE/DELETE',`<ol><li>Сформулируй бизнес-условие словами.</li><li>Напиши SELECT с тем же WHERE.</li><li>Проверь количество и конкретные ID строк.</li><li>Если операция критичная — выполняй в транзакции.</li><li>Используй RETURNING, чтобы видеть изменённые строки.</li><li>После операции проверь результат отдельным SELECT.</li></ol><div class="callout amber"><b>На собеседовании</b>Если тебя спрашивают «как безопасно сделать массовый UPDATE?», хороший ответ — не только синтаксис, но SELECT-preview, транзакция, backup/rollback plan, проверка количества строк и мониторинг.</div>`]
],interview:[['Что произойдёт при UPDATE без WHERE?','Будут обновлены все строки таблицы, если нет других ограничений/триггеров.'],['Зачем RETURNING?','Получить фактически созданные/изменённые значения в том же запросе; особенно полезно для ID и generated/default полей.'],['DELETE и soft delete — когда что?','DELETE физически удаляет. Soft delete сохраняет историю и используется, когда данные должны оставаться доступными для аудита/восстановления.'],['Что такое upsert?','INSERT с обработкой конфликта уникальности, например ON CONFLICT DO UPDATE.']]},
4:{level:'Base+',time:'45–60 мин',goal:'Понимать SELECT как формирование результата, а не просто «вывести столбцы».',sections:[
['SELECT — проекция результата',`<p class="lead">SELECT не обязан возвращать колонки «как они лежат». Он может вычислять выражения, переименовывать их, преобразовывать типы и создавать новую форму данных.</p><div class="code">SELECT\n  id,\n  name AS deal_name,\n  price,\n  price * 0.20 AS vat\nFROM deals;</div>`],
['SELECT * и почему на работе с ним осторожно',`<p><span class="inline">SELECT *</span> удобен для исследования БД. Но в API/production-коде он связывает потребителя со всеми колонками таблицы, может передавать лишние данные и делает контракт менее явным.</p><div class="callout green"><b>Нормальная практика аналитика</b>Для ad-hoc исследования SELECT * допустим. Для интеграционного контракта лучше явно перечислять нужные поля.</div>`],
['Aliases: AS',`<div class="code">SELECT\n  name AS deal_name,\n  price AS deal_price\nFROM deals;</div><p>Alias существует в результате запроса и помогает давать вычисленным/техническим полям понятные имена.</p>`],
['DISTINCT',`<div class="code">SELECT DISTINCT status\nFROM deals;</div><p>DISTINCT удаляет дубликаты <b>по всей комбинации выбранных столбцов</b>. <span class="inline">DISTINCT status, responsible_user_id</span> означает уникальные пары, а не уникальность каждого поля отдельно.</p><div class="callout red"><b>Антипаттерн</b>Если JOIN неожиданно размножил строки, добавлять DISTINCT «чтобы стало красиво» — плохой способ скрыть ошибку модели/соединения.</div>`],
['Выражения и вычисляемые столбцы',`<div class="code">SELECT\n  name,\n  price,\n  price * 1.20 AS price_with_vat\nFROM products;</div><p>SQL умеет арифметику, конкатенацию, CASE, функции дат и строк. Важно понимать тип результата выражения.</p>`],
['Порядок логической обработки',`<p>Запрос пишется SELECT → FROM → WHERE, но логически СУБД сначала формирует источник строк, потом фильтрует, группирует и только затем формирует SELECT.</p><div class="code">FROM / JOIN\nWHERE\nGROUP BY\nHAVING\nSELECT\nDISTINCT\nORDER BY\nLIMIT</div><p>Это объясняет многие «странности» с aliases и агрегатами.</p>`]
],interview:[['DISTINCT по двум колонкам — что делает?','Возвращает уникальные комбинации значений этих двух колонок.'],['Почему SELECT * нежелателен в API?','Неявный контракт, лишние данные, чувствительность к изменению схемы.']]},
5:{level:'Base+',time:'50–70 мин',goal:'Строить сложные фильтры без логических ошибок и понимать приоритет операторов.',sections:[
['WHERE фильтрует строки',`<p class="lead">WHERE — это логическое условие. Для каждой строки оно должно дать TRUE, чтобы строка попала дальше в запрос.</p><div class="code">SELECT *\nFROM deals\nWHERE price >= 50000;</div>`],
['AND, OR и приоритет',`<p>AND имеет более высокий приоритет, чем OR. Поэтому сложные условия лучше делать очевидными скобками.</p><div class="code">WHERE (status = 'won' OR status = 'new')\n  AND price >= 50000</div><div class="callout red"><b>Типичная ошибка</b><span class="inline">status='won' OR status='new' AND price&gt;50000</span> читается не так, как многие ожидают: сначала вычисляется AND.</div>`],
['IN вместо цепочки OR',`<div class="code">WHERE status IN ('new', 'won', 'in_progress')</div><p>Это обычно читабельнее, чем несколько OR. Семантически IN проверяет принадлежность значению из списка/подзапроса.</p>`],
['BETWEEN включителен',`<div class="code">WHERE price BETWEEN 50000 AND 100000</div><p>Обе границы включаются: эквивалент <span class="inline">price &gt;= 50000 AND price &lt;= 100000</span>.</p>`],
['NOT и отрицательные условия',`<div class="code">WHERE status NOT IN ('lost','won')</div><p>С NULL отрицательные условия требуют осторожности — это отдельно разберём в уроке 7.</p>`],
['Фильтр по датам',`<div class="code">WHERE created_at >= TIMESTAMP '2026-09-01 00:00:00'\n  AND created_at <  TIMESTAMP '2026-10-01 00:00:00'</div><p>Для временных диапазонов часто удобнее полуоткрытый интервал [start, end), особенно если время содержит секунды/миллисекунды.</p>`]
],interview:[['Что раньше: AND или OR?','AND. Для сложных условий лучше использовать скобки.'],['BETWEEN включает границы?','Да, обе.'],['Почему диапазон дат часто пишут >= start AND < next_day?','Чтобы корректно покрыть все значения времени внутри периода без ручного 23:59:59.999.']]},
6:{level:'Base+',time:'45–60 мин',goal:'Уверенно искать и нормализовать текстовые значения, понимая различия регистра и wildcard.',sections:[
['LIKE и шаблоны',`<div class="code">WHERE name LIKE 'Иван%'</div><p><span class="inline">%</span> — любое количество символов, <span class="inline">_</span> — ровно один символ.</p>`],
['ILIKE в PostgreSQL',`<div class="code">WHERE email ILIKE '%@gmail.com'</div><p>ILIKE — PostgreSQL-расширение для регистронезависимого поиска. В других СУБД поведение может отличаться.</p>`],
['LOWER/UPPER и нормализация',`<div class="code">SELECT LOWER(email), UPPER(name)\nFROM contacts;</div><p>Но если постоянно писать <span class="inline">LOWER(email)</span> в WHERE, это влияет на использование обычного индекса. Позже разберём expression indexes.</p>`],
['TRIM, LENGTH, CONCAT',`<div class="code">SELECT\n  TRIM(name),\n  LENGTH(name),\n  CONCAT(name, ' / ', phone)\nFROM contacts;</div><p>Такие функции полезны при миграциях и анализе грязных данных, но лучше не лечить ими постоянно плохой входной контракт.</p>`],
['Паттерн поиска и производительность',`<p><span class="inline">LIKE 'abc%'</span> потенциально дружит с индексами лучше, чем <span class="inline">LIKE '%abc%'</span>, потому что ведущий wildcard не даёт легко определить начало диапазона. Для полнотекстового/нечёткого поиска используются другие механизмы.</p>`]
],interview:[['LIKE и ILIKE?','LIKE обычно чувствителен к регистру, ILIKE в PostgreSQL — нет.'],['Что означает _ в LIKE?','Ровно один символ.'],['Почему %text% может быть медленным?','Ведущий wildcard ухудшает возможность использовать обычный B-tree индекс для префиксного диапазона.']]},
7:{level:'Middle foundation',time:'60–80 мин',goal:'Не допускать классических ошибок с NULL — одна из самых частых тем на SQL-собеседованиях.',sections:[
['NULL ломает привычную двузначную логику',`<p class="lead">SQL работает не только с TRUE/FALSE, но и с UNKNOWN. Сравнивать неизвестное значение обычным равенством бессмысленно.</p><div class="code">NULL = NULL   -- UNKNOWN\nNULL <> NULL  -- UNKNOWN</div>`],
['IS NULL / IS NOT NULL',`<div class="code">SELECT * FROM contacts\nWHERE email IS NULL;\n\nSELECT * FROM contacts\nWHERE email IS NOT NULL;</div><div class="callout red"><b>Никогда не пиши</b><span class="inline">WHERE email = NULL</span>. Это не вернёт строки так, как ожидает новичок.</div>`],
['UNKNOWN в WHERE',`<p>WHERE пропускает только TRUE. И FALSE, и UNKNOWN отбрасываются. Поэтому выражение <span class="inline">price &gt; 100</span> для строки, где price=NULL, не TRUE и не FALSE — оно UNKNOWN и строка не проходит.</p>`],
['NOT IN и NULL — известная ловушка',`<p>Если подзапрос/список для NOT IN содержит NULL, логика может дать UNKNOWN и результат окажется неожиданно пустым.</p><div class="callout amber"><b>Middle+ привычка</b>Для анти-джойна часто надёжнее думать через <span class="inline">NOT EXISTS</span>, особенно когда NULL возможен.</div>`],
['COALESCE',`<div class="code">SELECT name, COALESCE(email, 'email не указан')\nFROM contacts;</div><p>COALESCE возвращает первое не-NULL значение. Полезно для отображения и некоторых расчётов, но не надо маскировать им смысл «неизвестно» без бизнес-решения.</p>`],
['NULLIF',`<div class="code">SELECT amount / NULLIF(quantity, 0)\nFROM items;</div><p>NULLIF(a,b) возвращает NULL, если a=b. Иногда это удобно, чтобы избежать деления на ноль.</p>`],
['Агрегаты и NULL',`<p><span class="inline">COUNT(*)</span> считает строки. <span class="inline">COUNT(email)</span> считает только строки, где email не NULL. SUM/AVG обычно игнорируют NULL.</p><div class="code">SELECT COUNT(*) total_rows,\n       COUNT(email) rows_with_email\nFROM contacts;</div>`]
],interview:[['Почему = NULL неверно?','Потому что сравнение с NULL даёт UNKNOWN; нужно IS NULL.'],['COUNT(*) и COUNT(col)?','COUNT(*) считает строки, COUNT(col) — только не-NULL значения col.'],['Чем опасен NOT IN при NULL?','NULL внутри набора может сделать сравнение UNKNOWN и дать неожиданный результат; часто предпочтительнее NOT EXISTS.']]},
8:{level:'Base+ → Middle',time:'45–65 мин',goal:'Сортировать и пагинировать данные детерминированно, понимать ограничения OFFSET и принцип keyset pagination.',sections:[
['ORDER BY',`<div class="code">SELECT id, name, price\nFROM deals\nORDER BY price DESC;</div><p>ASC — по возрастанию, DESC — по убыванию.</p>`],
['Сортировка по нескольким полям',`<div class="code">ORDER BY created_at DESC, id DESC</div><p>Второй ключ нужен как tie-breaker, если created_at одинаковый. Это делает порядок детерминированным — критично для пагинации.</p>`],
['NULLS FIRST / LAST',`<div class="code">ORDER BY price DESC NULLS LAST</div><p>PostgreSQL позволяет явно управлять положением NULL. Лучше задавать это явно, когда логика важна.</p>`],
['LIMIT и OFFSET',`<div class="code">SELECT * FROM deals\nORDER BY id\nLIMIT 20 OFFSET 40;</div><p>Так можно получить «третью страницу» по 20 строк. Но OFFSET на больших смещениях становится дорогим: СУБД всё равно должна пройти/отсортировать предыдущие строки.</p>`],
['Проблема изменений между страницами',`<p>Если между запросами добавилась новая строка, OFFSET-пагинация может показать дубликат или пропустить запись. Это особенно заметно в быстро меняющихся лентах.</p>`],
['Keyset pagination',`<div class="code">SELECT *\nFROM deals\nWHERE (created_at, id) < (:last_created_at, :last_id)\nORDER BY created_at DESC, id DESC\nLIMIT 20;</div><p>Вместо «пропусти N строк» мы говорим «дай строки после последнего курсора». Это обычно быстрее и стабильнее на больших наборах, но нельзя просто прыгнуть на страницу 500 по номеру.</p>`]
],interview:[['Почему ORDER BY created_at может быть недетерминирован?','Несколько строк могут иметь одинаковый created_at; нужен второй уникальный ключ, например id.'],['Минусы OFFSET?','Стоимость растёт с глубиной страницы и возможны пропуски/дубли при изменениях данных.'],['Что такое keyset pagination?','Пагинация по значениям последней строки/курсору вместо числового смещения.']]}
};

{id:'3.4',lesson:3,title:'UPDATE одной строки',task:'Измени email контакта id=1 на ivan.new@example.com.',starter:"UPDATE contacts\nSET email = ''\nWHERE id = ;",check:"SELECT id,email FROM contacts WHERE id=1",expected:[{id:1,email:'ivan.new@example.com'}]},
{id:'3.5',lesson:3,title:'UPDATE по условию',task:"Сделай все сделки со status='new' дороже на 10 000.",starter:"UPDATE deals\nSET price = price + 10000\nWHERE ;",check:"SELECT name,price::text FROM deals WHERE status='new' ORDER BY id",expected:[{name:'Монтаж',price:'45000.00'},{name:'Premium',price:'160000.00'}]},
{id:'3.6',lesson:3,title:'DELETE точечно',task:"Удали сделку 'Ремонт' со статусом lost.",starter:"DELETE FROM deals\nWHERE ;",check:"SELECT count(*)::int AS cnt FROM deals WHERE name='Ремонт' AND status='lost'",expected:[{cnt:0}]},
{id:'3.7',lesson:3,title:'Soft delete модель',task:'Вместо удаления деактивируй контакт id=2: is_active=false.',starter:"UPDATE contacts\nSET is_active = \nWHERE id = ;",check:"SELECT id,is_active FROM contacts WHERE id=2",expected:[{id:2,is_active:false}]},
{id:'3.8',lesson:3,title:'RETURNING после UPDATE',task:'Сделай сделку id=2 won. Используй RETURNING id,status в запросе.',starter:"UPDATE deals\nSET status = 'won'\nWHERE id = 2\nRETURNING ;",check:"SELECT id,status FROM deals WHERE id=2",expected:[{id:2,status:'won'}]}
];

const seed=`
DROP TABLE IF EXISTS deals,products,contacts,users CASCADE;
CREATE TABLE users(id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,name VARCHAR(120) NOT NULL,email VARCHAR(255) UNIQUE,is_active BOOLEAN NOT NULL DEFAULT TRUE);
CREATE TABLE contacts(id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,name VARCHAR(150) NOT NULL,phone VARCHAR(30) NOT NULL,email VARCHAR(255),birth_date DATE,is_active BOOLEAN NOT NULL DEFAULT TRUE,created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP);
CREATE TABLE products(id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,name VARCHAR(150) NOT NULL,price NUMERIC(12,2) NOT NULL,quantity INTEGER NOT NULL DEFAULT 0,description TEXT,is_available BOOLEAN NOT NULL DEFAULT TRUE);
CREATE TABLE deals(id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,name VARCHAR(180) NOT NULL,price NUMERIC(12,2),status VARCHAR(30) NOT NULL,responsible_user_id BIGINT REFERENCES users(id),contact_id BIGINT REFERENCES contacts(id),created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP);
INSERT INTO users(name,email) VALUES ('Андрей','andrey@example.com'),('Мария','maria@example.com');
INSERT INTO contacts(name,phone,email) VALUES ('Иван Иванов','+79990000001','ivan@example.com'),('Анна Петрова','+79990000002',NULL);
INSERT INTO products(name,price,quantity,description) VALUES ('Кондиционер',80000,5,'Базовая модель'),('Монтаж',35000,20,'Монтажные работы');
INSERT INTO deals(name,price,status,responsible_user_id,contact_id) VALUES ('Кондиционер',80000,'won',1,1),('Монтаж',35000,'new',1,1),('Ремонт',15000,'lost',2,2),('Premium',150000,'new',2,2),('Монтаж Premium',65000,'won',1,2);
`;

let db;let currentLesson=3;let currentTab='theory';let currentExercise=exercises[0];
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const state=JSON.parse(localStorage.getItem('sqlschool-state-v03')||'{"doneLessons":[1,2],"doneExercises":[],"attempts":[]}');
function save(){localStorage.setItem('sqlschool-state-v03',JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function normalize(rows){return rows.map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k,typeof v==='bigint'?Number(v):v])))}
function same(a,b){return JSON.stringify(normalize(a))===JSON.stringify(normalize(b))}

function renderLessonList(){const box=$('#lessonList');box.innerHTML=roadmap.map((t,i)=>{let id=i+1;return `<button class="lessonbtn ${id===currentLesson?'active':''} ${state.doneLessons.includes(id)?'done':''}" data-lesson="${id}"><b>${id}. ${t}</b><span>${id<=8?'подробная глава + интервью':id<=20?'следующий блок курса':'Middle+ / advanced'}</span></button>`}).join('');$$('[data-lesson]').forEach(b=>b.onclick=()=>{currentLesson=+b.dataset.lesson;currentTab='theory';renderAll()})}
function renderHero(){const d=lessons[currentLesson];return `<div class="hero"><div class="eyebrow">Урок ${currentLesson} из 40 · ${d?.level||'Roadmap'}</div><h1>${roadmap[currentLesson-1]}</h1><p>${d?.goal||'Тема уже включена в программу курса. Подробная учебная глава будет добавлена до того, как ты дойдёшь до неё.'}</p><div class="meta"><span class="chip">${d?.time||'будет наполнено'}</span><span class="chip">CRM-примеры</span><span class="chip">интервью-вопросы</span>${currentLesson<=8?'<span class="chip">полная теория</span>':''}</div></div>`}
function renderTheory(){const d=lessons[currentLesson];if(!d)return `<div class="card placeholder"><h2>Тема ${currentLesson} уже в roadmap</h2><p>Я наполняю главы последовательно. Уроки 1–8 теперь сделаны в полноценном учебном формате; следующие будут добавляться тем же стандартом до твоего прохождения.</p></div>`;const toc=d.sections.map((s,i)=>`<a href="#sec${i}">${i+1}. ${s[0]}</a>`).join('');return `<div class="layout"><article class="article">${d.sections.map((s,i)=>`<section id="sec${i}" class="chapter"><h2>${i+1}. ${s[0]}</h2>${s[1]}</section>`).join('')}<section class="chapter"><h2>Что ты обязан уметь после урока</h2><div class="callout green"><b>Критерий прохождения</b>Ты должен уметь объяснить тему своими словами без заученной формулировки, прочитать чужой SQL, написать базовый запрос самостоятельно и ответить на интервью-вопросы ниже.</div><div class="qa">${d.interview.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}</div></section></article><aside class="card toc"><strong>Содержание главы</strong>${toc}<a href="#sec${d.sections.length}">Контрольные вопросы</a></aside></div>`}
function renderPractice(){const list=exercises.filter(e=>e.lesson===currentLesson);if(!list.length)return `<div class="card placeholder"><h2>Практика будет в отдельном наборе</h2><p>Для урока ${currentLesson} сейчас фокус на теории. В ближайших версиях здесь появятся блиц, основная практика и кейс системного аналитика.</p></div>`;if(!list.some(e=>e.id===currentExercise?.id))currentExercise=list[0];return `<div class="practicegrid"><div class="exercise-list">${list.map(e=>`<button class="exercise ${e.id===currentExercise.id?'active':''} ${state.doneExercises.includes(e.id)?'done':''}" data-ex="${e.id}"><b>${e.id} · ${e.title}</b><div style="font-size:10px;color:var(--muted);margin-top:4px">${state.doneExercises.includes(e.id)?'решено':'не решено'}</div></button>`).join('')}</div><div class="card workbench"><div class="eyebrow">Практика ${currentExercise.id}</div><h2>${currentExercise.title}</h2><p class="task">${currentExercise.task}</p><textarea id="sqlEditor" class="sql">${currentExercise.starter}</textarea><div class="actions"><button id="runBtn" class="btn alt">▶ Выполнить</button><button id="checkBtn" class="btn">Проверить решение</button><button id="resetBtn" class="btn alt">Сбросить БД</button></div><div id="feedback"></div><div id="result" class="result hidden"></div></div></div>`}
function renderLesson(){const tabs=`<div class="tabs"><button data-tab="theory" class="${currentTab==='theory'?'active':''}">Теория</button><button data-tab="practice" class="${currentTab==='practice'?'active':''}">Практика</button><button data-tab="interview" class="${currentTab==='interview'?'active':''}">Собеседование</button></div>`;let body=currentTab==='theory'?renderTheory():currentTab==='practice'?renderPractice():renderInterviewLesson();$('#lessonView').innerHTML=renderHero()+tabs+body;$$('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;renderLesson();wireLesson()});wireLesson()}
function renderInterviewLesson(){const d=lessons[currentLesson];if(!d)return `<div class="card placeholder">Интервью-вопросы будут добавлены вместе с полной главой.</div>`;return `<div class="card interview-card"><div class="eyebrow">Устный контроль</div><h2>Отвечай вслух, потом раскрывай ответ</h2><div class="qa">${d.interview.map(q=>`<details><summary>${q[0]}</summary><div class="answerbox">${q[1]}</div></details>`).join('')}</div></div>`}
function wireLesson(){$$('[data-ex]').forEach(b=>b.onclick=()=>{currentExercise=exercises.find(e=>e.id===b.dataset.ex);renderLesson()});if($('#runBtn'))$('#runBtn').onclick=runSql;if($('#checkBtn'))$('#checkBtn').onclick=checkExercise;if($('#resetBtn'))$('#resetBtn').onclick=resetDb}
function showRows(rows){const r=$('#result');r.classList.remove('hidden');if(!rows?.length){r.innerHTML='<div style="padding:12px;color:var(--muted)">Команда выполнена. Строк результата нет.</div>';return}const cols=Object.keys(rows[0]);r.innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${cols.map(c=>`<td>${esc(row[c]??'NULL')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
async function runSql(){const sql=$('#sqlEditor').value;try{const res=await db.query(sql);showRows(normalize(res.rows||[]));$('#feedback').innerHTML='<div class="feedback ok">SQL выполнен без ошибки.</div>'}catch(e){$('#feedback').innerHTML=`<div class="feedback bad"><b>Ошибка PostgreSQL:</b><br>${esc(e.message)}</div>`}}
async function checkExercise(){const sql=$('#sqlEditor').value;try{await resetDb(false);await db.query(sql);const res=await db.query(currentExercise.check);const ok=same(res.rows,currentExercise.expected);state.attempts.push({id:currentExercise.id,ok,at:new Date().toISOString(),sql});if(ok&&!state.doneExercises.includes(currentExercise.id))state.doneExercises.push(currentExercise.id);save();$('#feedback').innerHTML=ok?'<div class="feedback ok"><b>✅ Верно.</b> Решение прошло проверку на чистой БД.</div>':'<div class="feedback bad"><b>Пока нет.</b> SQL выполнился, но итоговое состояние БД не соответствует заданию.</div>';showRows(normalize(res.rows));renderLessonList();progressUI()}catch(e){state.attempts.push({id:currentExercise.id,ok:false,at:new Date().toISOString(),sql,error:e.message});save();$('#feedback').innerHTML=`<div class="feedback bad"><b>Ошибка PostgreSQL:</b><br>${esc(e.message)}</div>`;progressUI()}}
async function resetDb(show=true){await db.exec(seed);if(show&&$('#feedback'))$('#feedback').innerHTML='<div class="feedback ok">Учебная БД восстановлена.</div>'}
function renderGlobalInterview(){const qs=Object.entries(lessons).flatMap(([id,d])=>d.interview.map(q=>({lesson:+id,q:q[0],a:q[1]})));const x=qs[Math.floor(Math.random()*qs.length)];$('#interviewView').innerHTML=`<div class="hero"><div class="eyebrow">Interview mode · урок ${x.lesson}</div><h1>Ответь как на собеседовании</h1><p>Не пытайся произнести учебное определение. Сначала объясни идею своими словами, потом дай техническую формулировку и пример.</p></div><div class="card interview-card"><div class="interview-q">${x.q}</div><details><summary class="btn alt" style="display:inline-block">Показать опорный ответ</summary><div class="answerbox" style="margin-top:14px">${x.a}</div></details><div class="actions"><button id="nextInterview" class="btn">Следующий вопрос</button></div></div>`;$('#nextInterview').onclick=renderGlobalInterview}
function renderSandbox(){$('#sandboxView').innerHTML=`<div class="hero"><div class="eyebrow">Свободная практика</div><h1>PostgreSQL sandbox</h1><p>Здесь можно экспериментировать с учебной CRM. Если что-то сломаешь — нажми «Сбросить БД».</p></div><div class="card workbench"><textarea id="sandboxSql" class="sql">SELECT *\nFROM deals\nORDER BY id;</textarea><div class="actions"><button id="sandboxRun" class="btn">▶ Выполнить</button><button id="sandboxReset" class="btn alt">Сбросить БД</button></div><div id="sandboxFeedback"></div><div id="sandboxResult" class="result hidden"></div></div>`;$('#sandboxRun').onclick=async()=>{try{let r=await db.query($('#sandboxSql').value);const box=$('#sandboxResult');box.classList.remove('hidden');if(!r.rows.length)box.innerHTML='<div style="padding:12px">Выполнено.</div>';else{const rows=normalize(r.rows),cols=Object.keys(rows[0]);box.innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(x=>`<tr>${cols.map(c=>`<td>${esc(x[c]??'NULL')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}}catch(e){$('#sandboxFeedback').innerHTML=`<div class="feedback bad">${esc(e.message)}</div>`}};$('#sandboxReset').onclick=()=>resetDb(false)}
function renderProgress(){const ok=state.attempts.filter(a=>a.ok).length,total=state.attempts.length;$('#progressView').innerHTML=`<div class="hero"><div class="eyebrow">Диагностика</div><h1>Твой прогресс</h1><p>Цель — не закрывать уроки ради процента, а постепенно убрать повторяющиеся ошибки.</p></div><div class="kpis"><div class="kpi"><span>Уроков зачтено</span><strong>${state.doneLessons.length}</strong></div><div class="kpi"><span>Задач решено</span><strong>${state.doneExercises.length}</strong></div><div class="kpi"><span>Попыток</span><strong>${total}</strong></div><div class="kpi"><span>Успешных попыток</span><strong>${total?Math.round(ok/total*100):0}%</strong></div></div><div class="card" style="margin-top:14px;padding:20px"><h2>Последние попытки</h2>${state.attempts.slice(-10).reverse().map(a=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${a.id}</b> — ${a.ok?'✅ верно':'❌ ошибка'} <small style="color:var(--muted)">${new Date(a.at).toLocaleString()}</small></div>`).join('')||'<span style="color:var(--muted)">Практику ещё не запускали.</span>'}</div>`}
function progressUI(){const n=state.doneLessons.length;$('#progressText').textContent=`${n} / 40`;$('#progressBar').style.width=`${n/40*100}%`}
function renderAll(){renderLessonList();renderLesson();progressUI()}
$$('[data-view]').forEach(b=>b.onclick=()=>{const v=b.dataset.view;$$('[data-view]').forEach(x=>x.classList.toggle('active',x===b));['lesson','interview','sandbox','progress'].forEach(x=>$(`#${x}View`).classList.toggle('hidden',x!==v));if(v==='lesson')renderLesson();if(v==='interview')renderGlobalInterview();if(v==='sandbox')renderSandbox();if(v==='progress')renderProgress()});
try{db=await PGlite.create('idb://sqlschool-v03');const r=await db.query("select to_regclass('public.deals') t");if(!r.rows[0].t)await db.exec(seed);$('#dbStatus').textContent='PostgreSQL готов';}catch(e){$('#dbStatus').textContent='Ошибка PostgreSQL';console.error(e)}
renderAll();
</script>
</body>
